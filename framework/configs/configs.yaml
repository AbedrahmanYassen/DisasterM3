
experiment:
  name: "disasterm3_qwen_vqa_run_01"
  description: "Baseline VQA evaluation on DisasterM3 with Qwen-VL-Chat"
  tags: ["disasterm3", "qwen_vl", "vqa"]
  seed: 42

dataset:
  name: "disasterm3"
  subset: "disaster_type"           
  data_root: "data"                 
  max_samples: null                 
  overwrite: false                  
  image_size: null                  

model:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  max_tokens: 8192                  
  max_model_len: null               
  tensor_parallel_size: null       
  batch_size: 8

  max_num_frames: 32
  video_min_pixels: 200704          
  video_max_pixels: 1605632         

evaluation:
  task: "vqa"                       
  metrics:
    - "accuracy"                    
    - "f1"
    - "bleu"                        
  results_dir: "results"            
  save_predictions: true            

tracking:
  backend: "mlflow"                 
  mlflow:
    tracking_uri: "http://localhost:5000"
    experiment_name: "disaster-vlm-eval"
  wandb:
    project: "disaster-vlm-eval"
    entity: "your-team"
  log_artifacts: true               
  log_system_metrics: true          
